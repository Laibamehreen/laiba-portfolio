<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1326"/>
      <stop offset="100%" stop-color="#080B16"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="16" x2="64" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#borderGrad)" stroke-width="2.5"/>
  
  <!-- Subtle Corner Sparkle -->
  <circle cx="50" cy="14" r="3" fill="#A78BFA" opacity="0.8" filter="url(#glow)"/>
  
  <!-- Monogram LM -->
  <text 
    x="32" 
    y="41" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="24" 
    font-weight="900" 
    letter-spacing="-0.04em" 
    fill="url(#textGrad)"
  >
    LM
  </text>
</svg>
